<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ---------------- connection (publishable key — grants nothing without a session) ---------------- */
const SUPABASE_URL = "https://kcfjhhtqrmfmelvbtayp.supabase.co";
const SUPABASE_KEY = "sb_publishable_7ACKbW4e1Lo3-Q48wW3GGw_h4ZNh59Z";
const PREMIER_BUSINESS_ID = "adcc0599-ca4a-4917-a7da-15a82e23ddc2"; // affiliate program is Premier-only (CardPointe + Practice Fusion)
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------------- helpers ---------------- */
const G = {ok:['#e8f7ee','#0f5c2e','#bfe6cd'], warn:['#fdf6e7','#8a5a06','#f0dfb4'], info:['#eef4fd','#1558b0','#c9dcf7'], grey:['#f1f4f6','#5b6673','#e4e8ed'], vio:['#f3f0fc','#5b3fa8','#ddd4f5'], red:['#fdf1ef','#a13d2d','#f2d3cc']};
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const usd = n => '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d => d ? new Date(d + (d.length===10?'T12:00:00':'')).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
const monthKey = d => String(d).slice(0,7);
const monthLabel = k => new Date(k+'-15T12:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
const nyDay = ts => new Date(ts).toLocaleDateString('en-CA',{timeZone:'America/New_York'});
const STATUS_LABEL = {estimated:'Estimated', pending_review:'Pending Review', approved:'Owed', scheduled:'Scheduled', paid:'Paid', held:'Held'};
const STATUS_KIND  = {estimated:'grey', pending_review:'warn', approved:'warn', scheduled:'info', paid:'ok', held:'vio'};

function tierFor(schedule, gross){
  if (!gross || gross <= 0) return null;
  for (const t of schedule) if (gross >= t.min && (t.max == null || gross <= t.max)) return t;
  return schedule[schedule.length-1];
}
function badge(kind, text){ const c = G[kind]||G.grey; return `<span class="badge" style="background:${c[0]};color:${c[1]};border:1px solid ${c[2]}">${esc(text)}</span>`; }
function infoI(tip){ return `<span class="info-i" title="${esc(tip)}">i</span>`; }
function webLinks(a){
  const chips = [];
  const chip = (href,label,title) => `<a href="${esc(href)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="${esc(title)}" style="display:inline-flex;align-items:center;gap:4px;border:1px solid #dde3e9;border-radius:20px;padding:2px 8px;font:600 10.5px 'Helvetica Neue',Helvetica,sans-serif;color:#3f4a58;text-decoration:none">${label}</a>`;
  if (a.website) chips.push(chip(a.website,'🌐 Site',a.website));
  if (a.landing_page) chips.push(chip(a.landing_page,'📄 Landing',a.landing_page));
  const s = a.socials||{};
  if (s.instagram) chips.push(chip(s.instagram,'IG','Instagram'));
  if (s.facebook) chips.push(chip(s.facebook,'FB','Facebook'));
  if (s.google) chips.push(chip(s.google,'G','Google Business'));
  return chips.length ? `<div style="display:flex;gap:5px;flex-wrap:wrap">${chips.join('')}</div>` : '';
}
function statCard(label, tip, value, sub){
  return `<div style="background:#fff;padding:14px 15px">
    <div style="display:flex;align-items:center;gap:5px"><span style="font-size:11.5px;color:#6b7684">${label}</span>${infoI(tip)}</div>
    <div style="margin-top:7px;font:600 24px/1.1 'Helvetica Neue',Helvetica,sans-serif;letter-spacing:-.02em">${value}</div>
    <div style="margin-top:4px;font-size:11px;color:#8c96a2">${sub}</div>
  </div>`;
}

/* live table search — hides rows that don't match, no re-render */
window.filterRows = (inp) => {
  const q = inp.value.toLowerCase();
  inp.closest('section').querySelectorAll('tbody tr.row').forEach(r=>{
    r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
};

/* Edge Function caller — runs under the signed-in user's identity */
async function callFn(name, body){
  const { data: { session } } = await supabase.auth.getSession();
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+session.access_token },
    body: JSON.stringify(body||{})
  });
  const j = await r.json().catch(()=>({error:'invalid response'}));
  if (!r.ok) throw Object.assign(new Error(j.message||j.error||('HTTP '+r.status)), {payload:j});
  return j;
}

/* Pagination helper — PostgREST caps un-paginated selects at 1,000 rows */
async function fetchAll(table, columns, applyFilters = (q) => q) {
  const rows = [];
  const PAGE = 1000;
  for (let from = 0; ; from += PAGE) {
    let q = supabase.from(table).select(columns).order("id");
    q = applyFilters(q);
    const { data, error } = await q.range(from, from + PAGE - 1);
    if (error) throw new Error(`${table}: ${error.message}`);
    rows.push(...data);
    if (data.length < PAGE) break;
  }
  return rows;
}

/* ---------------- state + data model ---------------- */
const state = {view:'list', tab:'customers', affiliateId:null, openRows:{}, openContrib:{}, drawer:null, confirm:false,
  payOpen:false, payBusy:false, payMsg:null, payReceiver:null, syncOpen:false, syncData:null, syncMsg:null};
let userEmail = '';
let DATA = null;
let M = null;

async function loadData(){
  const affs = await fetchAll('aff_affiliates','*');
  if (!affs.length) throw new Error('No affiliates found');
  const [clients, ledger, payouts, audit] = await Promise.all([
    fetchAll('aff_referred_clients','*'),
    fetchAll('aff_ledger_entries','*'),
    fetchAll('aff_payouts','*'),
    fetchAll('aff_audit_log','*')
  ]);
  // Live CardPointe revenue for matched patients (Premier only; 'draft' rows excluded by source filter)
  const patientIds = clients.filter(c=>c.patient_id).map(c=>c.patient_id);
  let live = [];
  if (patientIds.length){
    live = await fetchAll('dashboard_transactions','id,patient_id,amount,transaction_date,source', q=>
      q.eq('business_id', PREMIER_BUSINESS_ID).eq('source','cardpointe').in('patient_id', patientIds));
  }
  return {affs, clients, ledger, payouts, audit, live};
}

function buildModel(D, affId){
  const curKey = nyDay(Date.now()).slice(0,7);
  const summaries = D.affs.map(a=>{
    const cs = D.clients.filter(c=>c.affiliate_id===a.id);
    const ps = D.payouts.filter(p=>p.affiliate_id===a.id);
    const gross = ps.reduce((s,p)=>s+Number(p.gross),0);
    const owed = ps.filter(p=>['approved','pending_review','scheduled','held'].includes(p.status)).reduce((s,p)=>s+Number(p.commission),0);
    const paid = ps.filter(p=>p.status==='paid').reduce((s,p)=>s+Number(p.commission),0);
    const pats = new Set(cs.filter(c=>c.status==='active'&&c.patient_id).map(c=>c.patient_id));
    const liveGross = D.live.filter(t=>pats.has(t.patient_id) && nyDay(t.transaction_date).slice(0,7)===curKey).reduce((s,t)=>s+Number(t.amount),0);
    const tier = tierFor(a.tier_schedule, liveGross);
    return {aff:a, clients:cs.length, active:cs.filter(c=>c.status==='active').length, gross, owed, paid, liveGross, tier};
  }).sort((a,b)=> (b.gross+b.paid) - (a.gross+a.paid) || a.aff.name.localeCompare(b.aff.name));

  const aff = D.affs.find(x=>x.id===affId) || D.affs.find(x=>x.code==='DD') || D.affs[0];
  const clients = D.clients.filter(c=>c.affiliate_id===aff.id);
  const ledger = D.ledger.filter(e=>e.affiliate_id===aff.id);
  const payouts = D.payouts.filter(p=>p.affiliate_id===aff.id);
  const audit = D.audit.filter(x=>x.affiliate_id===aff.id);
  const affPats = new Set(clients.filter(c=>c.patient_id).map(c=>c.patient_id));
  const live = D.live.filter(t=>affPats.has(t.patient_id));

  const schedule = aff.tier_schedule;
  const byId = Object.fromEntries(clients.map(c=>[c.id,c]));
  const rateByMonth = {}; payouts.forEach(p=>{ rateByMonth[monthKey(p.sale_month)] = Number(p.rate)||0; });

  const nowKey = curKey;
  const closedMonths = new Set(payouts.map(p=>monthKey(p.sale_month)));
  const activePatients = new Set(clients.filter(c=>c.status==='active'&&c.patient_id).map(c=>c.patient_id));
  const liveCur = live.filter(t=>activePatients.has(t.patient_id) && nyDay(t.transaction_date).slice(0,7)===nowKey);
  const curGross = liveCur.reduce((s,t)=>s+Number(t.amount),0);
  const curTier = tierFor(schedule, curGross);
  const curEst = curTier ? curGross*curTier.rate : 0;

  const clientAgg = {};
  clients.forEach(c=>clientAgg[c.id]={gross:0, commission:0, paid:0, approved:0, firstSale:null, lastSale:null, txns:0});
  ledger.forEach(e=>{
    const a = clientAgg[e.referred_client_id]; if(!a) return;
    if (e.eligible){
      const rate = rateByMonth[monthKey(e.sale_date)] ?? 0;
      a.gross += Number(e.amount); a.txns++;
      const commission = Number(e.amount)*rate;
      a.commission += commission;
      const p = payouts.find(p=>monthKey(p.sale_month)===monthKey(e.sale_date));
      if (p && p.status==='paid') a.paid += commission; else if (p) a.approved += commission;
      if (!a.firstSale || e.sale_date < a.firstSale) a.firstSale = e.sale_date;
      if (!a.lastSale || e.sale_date > a.lastSale) a.lastSale = e.sale_date;
    }
  });
  const liveByClient = {};
  clients.forEach(c=>{ liveByClient[c.id] = liveCur.filter(t=>t.patient_id===c.patient_id); });

  const monthly = {};
  ledger.filter(e=>e.eligible).forEach(e=>{ const k=monthKey(e.sale_date); monthly[k]=(monthly[k]||0)+Number(e.amount); });
  const monthlyExcl = {};
  ledger.filter(e=>!e.eligible).forEach(e=>{ const k=monthKey(e.sale_date); monthlyExcl[k]=(monthlyExcl[k]||0)+Number(e.amount); });
  if (curGross>0 && !closedMonths.has(nowKey)) monthly[nowKey]=(monthly[nowKey]||0)+curGross;

  const totalGross = payouts.reduce((s,p)=>s+Number(p.gross),0);
  const totalPaid = payouts.filter(p=>p.status==='paid').reduce((s,p)=>s+Number(p.commission),0);
  const totalOwed = payouts.filter(p=>['approved','pending_review','scheduled','held'].includes(p.status)).reduce((s,p)=>s+Number(p.commission),0);
  const lastPaidDate = payouts.filter(p=>p.status==='paid').map(p=>p.paid_date).sort().pop();

  const sortedPayouts = [...payouts].sort((a,b)=>b.sale_month.localeCompare(a.sale_month));
  const reviewPayout = sortedPayouts[0] || null;

  return {affiliates:D.affs, summaries,
    aff, clients, ledger, payouts:sortedPayouts, audit:[...audit].sort((a,b)=>b.at.localeCompare(a.at)), live,
    schedule, rateByMonth, byId, clientAgg, liveByClient, monthly, monthlyExcl, nowKey,
    curGross, curTier, curEst, totalGross, totalPaid, totalOwed, lastPaidDate, reviewPayout};
}

/* ---------------- app actions ---------------- */
const app = {
  setView(v){ state.view = v; render(); },
  openAffiliate(id){ state.affiliateId = id; state.tab='customers'; state.openRows={}; state.openContrib={}; M = buildModel(DATA, id); state.view = 'detail'; render(); },
  setTab(t){ state.tab = t; render(); },
  toggleRow(i){ state.openRows[i] = !state.openRows[i]; render(); },
  toggleContrib(i){ state.openContrib[i] = !state.openContrib[i]; render(); },
  openDrawer(idx){ state.drawer = idx; renderOverlays(); },
  closeDrawer(){ state.drawer = null; renderOverlays(); },
  openConfirm(){ state.confirm = true; renderOverlays(); },
  closeConfirm(){ state.confirm = false; renderOverlays(); },
  async signOut(){ await supabase.auth.signOut(); location.reload(); },
  async refresh(){ document.getElementById('header-status').textContent='Refreshing…'; DATA = await loadData(); M = buildModel(DATA, state.affiliateId); render(); setHeaderStatus(); },

  openPay(){ state.payOpen = true; state.payMsg = null; state.payBusy = false; renderOverlays(); },
  closePay(){ state.payOpen = false; renderOverlays(); },
  async submitPay(){
    const ids = [...document.querySelectorAll('.pay-check:checked')].map(el=>el.dataset.id);
    const receiver = (document.getElementById('pay-receiver')?.value||'').trim();
    state.payReceiver = receiver;
    if (!ids.length){ state.payMsg = {kind:'err', text:'Select at least one payout month.'}; return renderOverlays(); }
    if (!receiver.includes('@')){ state.payMsg = {kind:'err', text:"Enter the affiliate's PayPal email."}; return renderOverlays(); }
    state.payBusy = true; state.payMsg = null; renderOverlays();
    try {
      const res = await callFn('payments-send', {payout_ids: ids, receiver});
      if (receiver !== M.aff.paypal_email) await supabase.from('aff_affiliates').update({paypal_email: receiver}).eq('id', M.aff.id);
      state.payBusy = false;
      state.payMsg = {kind:'ok', text:`Sent $${res.total} via PayPal (${res.env}) — batch ${res.paypal_batch_id}. Records updated.`};
      renderOverlays();
      DATA = await loadData(); M = buildModel(DATA, state.affiliateId); render();
    } catch(e){
      state.payBusy = false;
      state.payMsg = {kind:'err', text:e.message};
      renderOverlays();
    }
  },
  async syncPaypal(){
    state.syncOpen = true; state.syncData = null; state.syncMsg = 'Loading PayPal activity…'; renderOverlays();
    try { const res = await callFn('payments-activity', {}); state.syncData = res; state.syncMsg = null; }
    catch(e){ state.syncMsg = e.message; }
    renderOverlays();
  },
  closeSync(){ state.syncOpen = false; renderOverlays(); },
  async markPaid(id){
    if (!confirm('Mark this payout as paid (manually recorded, outside PayPal)?')) return;
    const today = nyDay(Date.now());
    const { error } = await supabase.from('aff_payouts').update({status:'paid', paid_date:today, method:M.aff.payout_method, reference:'Manual · '+today}).eq('id', id);
    if (error) return alert(error.message);
    await supabase.from('aff_audit_log').insert({affiliate_id:M.aff.id, actor:userEmail||'staff', action:'Payout marked paid manually.'});
    app.refresh();
  }
};
window.app = app;

function setHeaderStatus(){
  document.getElementById('header-status').innerHTML = `<span class="live-dot">Live</span>`;
}

/* ---------------- affiliates roster ---------------- */
function listView(){
  const rows = M.summaries.map(s=>{
    const a = s.aff;
    const initials = a.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

function revenueChart(){
  const months = [];
  const now = new Date(M.nowKey+'-15T12:00:00');
  for (let i=11;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 15); months.push(d.toISOString().slice(0,7)); }
  const maxVal = Math.max(1, ...months.map(k=>(M.monthly[k]||0)+(M.monthlyExcl[k]||0)));
  const axisTop = Math.ceil(maxVal/600)*600;
  const bars = months.map(k=>{
    const g = M.monthly[k]||0, x = M.monthlyExcl[k]||0;
    const gp = Math.round(g/axisTop*100), xp = Math.round(x/axisTop*100);
    const rate = M.rateByMonth[k] ?? (k===M.nowKey&&M.curTier?M.curTier.rate:0);
    const comm = g*rate;
    const label = new Date(k+'-15T12:00:00').toLocaleDateString('en-US',{month:'short'});
    const tip = `${monthLabel(k)} · gross ${usd(g)}${x?' · excluded '+usd(x):''}${comm?' · commission '+usd(comm):''}`;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end" title="${esc(tip)}">
    <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative">
    <div style="height:${xp}%;background:#e6e9ee;border-radius:2px 2px 0 0"></div>
    <div style="height:${gp}%;background:#17a34a;opacity:.85"></div>
    ${comm?`<div style="position:absolute;left:-2px;right:-2px;bottom:${Math.max(1,Math.round(comm/axisTop*100))}%;height:2px;background:#7c5cd6;border-radius:2px"></div>`:''}
    </div>
    <span style="font-size:9.5px;color:#a6b0bb">${label}</span>
  </div>`;
  }).join('');
  return `<section class="card" style="padding:16px 18px">
<div style="display:flex;align-items:baseline;gap:8px"><h2 class="h2-sm">Referred Revenue</h2><span style="font-size:11px;color:#8c96a2">last 12 months</span></div>
<div style="margin-top:12px;display:flex;align-items:flex-end;gap:10px;height:150px;padding-left:34px;position:relative">
<div style="position:absolute;left:0;top:0;bottom:18px;width:32px;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:#a6b0bb;text-align:right"><span>$${(axisTop/1000).toFixed(1).replace('.0','')}k</span><span>$${(axisTop/2000).toFixed(1).replace('.0','')}k</span><span>$0</span></div>
${bars}
</div>
<div style="margin-top:8px;display:flex;gap:14px;font-size:11px;color:#5b6673">
<span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:#17a34a"></span>Revenue</span>
<span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:#e6e9ee"></span>Excluded</span>
<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:2px;background:#7c5cd6"></span>Commission</span>
</div>
</section>`;
}

function methodChartCard(){
  const agg = {};
  M.ledger.filter(e=>e.eligible).forEach(e=>{
    const c = M.byId[e.referred_client_id]; if(!c) return;
    const m = c.referral_method || '—';
    agg[m] = (agg[m]||0) + Number(e.amount);
  });
  const entries = Object.entries(agg).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(1,...entries.map(e=>e[1]));
  const rows = entries.map(([m,v])=>`<div style="display:flex;align-items:center;gap:10px;font-size:12px">
    <span style="width:170px;color:#3f4a58">${esc(m)}</span>
    <div style="flex:1;height:14px;border-radius:4px;background:#eef1f4"><div style="height:14px;border-radius:4px;background:#7c5cd6;opacity:.75;width:${Math.round(v/max*100)}%"></div></div>
    <span style="width:80px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">${usd(v)}</span>
  </div>`).join('');
  return `<section class="card" style="padding:16px 18px">
<div style="display:flex;align-items:baseline;gap:8px"><h2 class="h2-sm">Revenue by Referral Method</h2></div>
<div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">${rows||'<span style="font-size:12px;color:#8c96a2">No data yet</span>'}</div>
</section>`;
}

    const c = M.byId[cid];
    const open = !!state.openContrib[i];
    const gross = entries.reduce((s,e)=>s+Number(e.amount),0);
    const contribution = gross*Number(p.rate);
    let html = `<tr class="row clickable" onclick="app.toggleContrib(${i})">
<td><span style="color:#a6b0bb;font-size:10px;margin-right:8px">${open?'▾':'▸'}</span><span style="font-weight:600;color:#1d6fe0">${esc(c.display_name)}</span></td>
<td style="text-align:right">${entries.length}</td>
<td class="num">${usd(gross)}</td>
<td class="num" style="font-weight:600">${usd(contribution)}</td>
</tr>`;
    if (open){
      const detail = entries.map(e=>`<tr style="color:#8c96a2"><td style="padding:8px 14px 8px 44px;font-weight:600">${fmtDate(e.sale_date)}</td><td style="padding:8px 12px">${esc(e.note||'')}</td><td style="padding:8px 12px;text-align:right;color:#111a26">${usd(e.amount)}</td><td style="padding:8px 12px;text-align:right;color:#111a26">${usd(Number(e.amount)*Number(p.rate))}</td></tr>`).join('');
      html += `<tr style="background:#fafbfc;border-bottom:1px solid #eef1f4"><td colspan="4" style="padding:0"><table style="border-collapse:collapse;width:100%;font-size:12px"><tbody>${detail}</tbody></table></td></tr>`;
    }
    return html;
  }).join('');

  const paid = p.status==='paid';
  return `<div style="max-width:1520px;margin:0 auto;display:flex;flex-direction:column;gap:14px">
<section class="card" style="padding:18px 20px">
<div style="display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap">
<div>
<h1 style="margin:0;font:600 19px 'Helvetica Neue',Helvetica,sans-serif;letter-spacing:-.01em">${esc(M.aff.name)} · ${monthLabel(k)}</h1>
<div style="margin-top:6px;font-size:12.5px;color:#3f4a58">${esc(p.tier)} tier · ${Math.round(p.rate*100)}% of ${usd(p.gross)} · due ${fmtDate(p.due_date)}</div>
</div>
${paid
  ? `<span style="font:600 11px 'Helvetica Neue',Helvetica,sans-serif;color:#0f5c2e;background:#e8f7ee;border:1px solid #bfe6cd;border-radius:20px;padding:4px 10px">Paid · ${fmtDate(p.paid_date)} via ${esc(p.method)}</span>`
  : `<span style="font:600 11px 'Helvetica Neue',Helvetica,sans-serif;color:#8a5a06;background:#fdf6e7;border:1px solid #f0dfb4;border-radius:20px;padding:4px 10px">${STATUS_LABEL[p.status]}</span>`}
<div style="flex:1"></div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
${paid?`<button class="btn-primary" onclick="app.openConfirm()">Payment Record</button>`:`<button class="btn-primary" onclick="app.openPay()">Pay via PayPal</button>`}
<button class="btn" style="padding:8px 12px;font-size:12.5px">Statement</button>
</div>
</div>
<div class="kpi-grid" style="margin-top:16px;grid-template-columns:repeat(4,1fr)">
${kpi('Revenue',usd(p.gross))}
${kpi('Tier',esc(p.tier)+' · '+Math.round(p.rate*100)+'%')}
${kpi('Commission',usd(p.commission))}
${kpi(paid?'Paid':'Remaining',usd(p.commission),paid?'color:#0f5c2e':'')}
</div>
</section>

<section class="card">
<div style="display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #eef1f4">
<h2 class="h2-sm">By client</h2>
</div>
<table class="tbl">
<thead><tr>
<th>Client</th><th class="num">Sales</th><th class="num">Revenue</th><th class="num">Commission</th>
</tr></thead>
<tbody>${contribRows}</tbody>
</table>
</section>
</div>`;
}

/* ---------------- sync status view ---------------- */
function emptyView(){
  const liveCount = M.live.length;
  const matched = M.clients.filter(c=>c.patient_id).length;
  return `<div style="max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px">
<section class="card" style="padding:18px 20px">
<h2 class="h2-sm">Connections</h2>
<div style="margin-top:12px;display:flex;flex-direction:column;gap:10px;font-size:12.5px">
<div style="display:flex;gap:10px;align-items:center"><span class="live-dot"></span><strong>Glow data platform</strong><span style="color:#6b7684">— connected</span></div>
<div style="display:flex;gap:10px;align-items:center"><span class="live-dot"></span><strong>CardPointe</strong><span style="color:#6b7684">— ${liveCount} transactions tracked for matched clients</span></div>
<div style="display:flex;gap:10px;align-items:center"><span class="live-dot"></span><strong>Practice Fusion</strong><span style="color:#6b7684">— ${matched} of ${M.clients.length} clients matched</span></div>
<div style="display:flex;gap:10px;align-items:center"><span style="width:6px;height:6px;border-radius:50%;background:#c7d0d8"></span><strong>PayPal</strong><span style="color:#6b7684">— add secrets in Supabase to activate</span><button class="btn" style="padding:4px 9px;font-size:11.5px" onclick="app.syncPaypal()">Test connection</button></div>
</div>
<div style="margin-top:14px;font-size:11.5px;color:#8c96a2;line-height:1.7">PayPal setup: Supabase Dashboard → Edge Functions → Secrets → <code>PAYPAL_CLIENT_ID</code>, <code>PAYPAL_CLIENT_SECRET</code>, <code>PAYPAL_ENV</code> (<code>sandbox</code> or <code>live</code>).<br>Client data is PHI — keep it inside this app.</div>
</section>
</div>`;
}

/* ---------------- overlays ---------------- */
function drawerHTML(){
  const e = M.ledger.find(x=>x.id===state.drawer);
  if (!e) return '';
  const c = M.byId[e.referred_client_id];
  const k = monthKey(e.sale_date);
  const p = M.payouts.find(p=>monthKey(p.sale_month)===k);
  const rate = e.eligible && p ? Number(p.rate) : 0;
  const contribution = Number(e.amount)*rate;
  return `<div style="position:fixed;inset:0;background:rgba(15,22,34,.32);display:flex;justify-content:flex-end;z-index:20">
<div onclick="app.closeDrawer()" style="flex:1"></div>
<div style="width:400px;background:#fff;height:100%;overflow:auto;box-shadow:-8px 0 24px rgba(15,22,34,.14);padding:20px 22px">
<div style="display:flex;align-items:flex-start;gap:12px">
<div style="flex:1">
<div style="font:600 15px 'Helvetica Neue',Helvetica,sans-serif">${esc(c?c.display_name:'')}</div>
<div style="margin-top:4px;font-size:12px;color:#6b7684">${fmtDate(e.sale_date)}</div>
</div>
<button onclick="app.closeDrawer()" style="border:1px solid #dde3e9;background:#fff;border-radius:6px;width:26px;height:26px;cursor:pointer;color:#6b7684">✕</button>
</div>
<div style="margin-top:16px;border:1px solid #eef1f4;border-radius:9px;overflow:hidden">
<div style="display:flex;justify-content:space-between;padding:10px 13px;border-bottom:1px solid #eef1f4;font-size:12.5px"><span style="color:#6b7684">Sale</span><span style="font-weight:600">${usd(e.amount)}</span></div>
<div style="display:flex;justify-content:space-between;padding:10px 13px;border-bottom:1px solid #eef1f4;font-size:12.5px"><span style="color:#6b7684">Tier</span><span>${p&&e.eligible?esc(p.tier)+' · '+Math.round(rate*100)+'%':'—'}</span></div>
<div style="display:flex;justify-content:space-between;padding:10px 13px;border-bottom:1px solid #eef1f4;font-size:12.5px"><span style="color:#6b7684">Status</span><span style="color:${e.eligible?'#0f5c2e':'#a13d2d'};font-weight:600">${e.eligible?(p?STATUS_LABEL[p.status]:'—'):'Excluded'}</span></div>
<div style="display:flex;justify-content:space-between;padding:10px 13px;font-size:13px;background:#fafbfc"><span style="font-weight:600">Commission</span><span style="font-weight:600">${usd(contribution)}</span></div>
</div>
${e.note?`<div class="lab" style="margin-top:16px">Note</div>
<div style="margin-top:6px;font-size:12.5px;color:#3f4a58">${esc(e.note)}</div>`:''}
</div>
</div>`;
}

function confirmHTML(){
  const paidRows = M.payouts.filter(p=>p.status==='paid').map(p=>
    `<div style="display:flex;justify-content:space-between;padding:9px 13px;border-bottom:1px solid #eef1f4"><span style="color:#6b7684">${monthLabel(monthKey(p.sale_month))} · ${esc(p.tier)} · ${Math.round(p.rate*100)}%</span><span>${usd(p.commission)}</span></div>`).reverse().join('');
  return `<div style="position:fixed;inset:0;background:rgba(15,22,34,.32);display:flex;align-items:center;justify-content:center;z-index:30">
<div style="width:420px;background:#fff;border-radius:12px;padding:22px 24px;box-shadow:0 18px 40px rgba(15,22,34,.22)">
<div style="font:600 15px 'Helvetica Neue',Helvetica,sans-serif">Payment record</div>
<div style="margin-top:8px;font-size:12.5px;color:#5b6673">Paid ${fmtDate(M.lastPaidDate)} via ${esc(M.aff.payout_method)}.</div>
<div style="margin-top:12px;border:1px solid #eef1f4;border-radius:9px;overflow:hidden;font-size:12.5px">
${paidRows}
<div style="display:flex;justify-content:space-between;padding:9px 13px;background:#fafbfc"><span style="font-weight:600">Total</span><span style="font-weight:600;color:#0f5c2e">${usd(M.totalPaid)}</span></div>
</div>
<div style="margin-top:18px;display:flex;justify-content:flex-end">
<button onclick="app.closeConfirm()" class="btn" style="padding:8px 14px;font-size:12.5px">Close</button>
</div>
</div>
</div>`;
}

function payModalHTML(){
  const unpaid = M.payouts.filter(p=>p.status!=='paid');
  const rows = unpaid.map(p=>`<label style="display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid #eef1f4;font-size:12.5px;cursor:pointer">
    <input type="checkbox" class="pay-check" data-id="${p.id}" checked style="margin:0">
    <span style="flex:1">${monthLabel(monthKey(p.sale_month))} · ${esc(p.tier)} · ${Math.round(p.rate*100)}%</span>
    <span style="font-weight:600;font-variant-numeric:tabular-nums">${usd(p.commission)}</span>
  </label>`).join('');
  const total = unpaid.reduce((s,p)=>s+Number(p.commission),0);
  const receiver = state.payReceiver ?? M.aff.paypal_email ?? '';
  const msg = state.payMsg ? `<div style="margin-top:10px;font-size:12px;line-height:1.5;color:${state.payMsg.kind==='ok'?'#0f5c2e':'#a13d2d'}">${esc(state.payMsg.text)}</div>` : '';
  return `<div style="position:fixed;inset:0;background:rgba(15,22,34,.32);display:flex;align-items:center;justify-content:center;z-index:40">
<div style="width:440px;background:#fff;border-radius:12px;padding:22px 24px;box-shadow:0 18px 40px rgba(15,22,34,.22)">
<div style="font:600 15px 'Helvetica Neue',Helvetica,sans-serif">Pay ${esc(M.aff.name)} via PayPal</div>
<div style="margin-top:6px;font-size:12px;color:#6b7684">Money moves from the Premier Solutions PayPal balance when you confirm.</div>
${unpaid.length ? `<div style="margin-top:12px;border:1px solid #eef1f4;border-radius:9px;overflow:hidden" id="pay-list">
${rows}
<div style="display:flex;justify-content:space-between;padding:9px 13px;background:#fafbfc;font-size:12.5px"><span style="font-weight:600">Total</span><span style="font-weight:600;color:#0f5c2e">${usd(total)}</span></div>
</div>
<div style="margin-top:12px">
<div class="lab">Affiliate PayPal email</div>
<input id="pay-receiver" class="login-input" style="margin-top:6px" type="email" placeholder="name@example.com" value="${esc(receiver)}">
</div>` : `<div style="margin-top:14px;font-size:12.5px;color:#5b6673">Nothing unpaid — new payouts appear when a sale month closes.</div>`}
${msg}
<div style="margin-top:18px;display:flex;justify-content:flex-end;gap:8px">
<button onclick="app.closePay()" class="btn" style="padding:8px 14px;font-size:12.5px">${state.payMsg&&state.payMsg.kind==='ok'?'Close':'Cancel'}</button>
${unpaid.length?`<button onclick="app.submitPay()" class="btn-primary" ${state.payBusy?'disabled':''}>${state.payBusy?'Sending…':'Send Payout'}</button>`:''}
</div>
</div>
</div>`;
}

function syncModalHTML(){
  let body = '';
  if (state.syncMsg) body = `<div style="margin-top:14px;font-size:12.5px;color:#5b6673;line-height:1.6">${esc(state.syncMsg)}</div>`;
  else if (state.syncData){
    const txns = state.syncData.transactions||[];
    body = txns.length ? `<div style="margin-top:12px;border:1px solid #eef1f4;border-radius:9px;overflow:auto;max-height:320px">
    <table class="tbl"><thead><tr><th>Date</th><th>Counterparty</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>
    ${txns.map(t=>`<tr class="row"><td class="mut">${esc(String(t.date||'').slice(0,10))}</td><td class="mut">${esc(t.counterparty||'—')}</td><td class="num" style="color:${Number(t.amount)<0?'#a13d2d':'#0f5c2e'}">${esc(t.amount)} ${esc(t.currency||'')}</td><td class="mut">${esc(t.status||'')}</td></tr>`).join('')}
    </tbody></table></div>`
    : `<div style="margin-top:14px;font-size:12.5px;color:#5b6673">No PayPal transactions in the last 30 days (${esc(state.syncData.env)}).</div>`;
  }
  return `<div style="position:fixed;inset:0;background:rgba(15,22,34,.32);display:flex;align-items:center;justify-content:center;z-index:40">
<div style="width:560px;background:#fff;border-radius:12px;padding:22px 24px;box-shadow:0 18px 40px rgba(15,22,34,.22)">
<div style="font:600 15px 'Helvetica Neue',Helvetica,sans-serif">PayPal activity · last 30 days</div>
${body}
<div style="margin-top:18px;display:flex;justify-content:flex-end">
<button onclick="app.closeSync()" class="btn" style="padding:8px 14px;font-size:12.5px">Close</button>
</div>
</div>
</div>`;
}

/* ---------------- top-level render ---------------- */
function render(){
  if (!M) return;
  document.getElementById('nav-list').className = 'topnav-btn' + (state.view==='list' ? ' on' : '');
  document.getElementById('nav-detail').className = 'topnav-btn' + (state.view==='detail' ? ' on' : '');
  document.getElementById('nav-payout').className = 'topnav-btn' + (state.view==='payout' ? ' on' : '');
  document.getElementById('nav-empty').className = 'topnav-btn' + (state.view==='empty' ? ' on' : '');
  const main = document.getElementById('main');
  if (state.view==='list') main.innerHTML = listView();
  else if (state.view==='detail') main.innerHTML = detailView();
  else if (state.view==='payout') main.innerHTML = payoutView();
  else main.innerHTML = emptyView();
}
function renderOverlays(){
  document.getElementById('overlays').innerHTML = (state.drawer!=null ? drawerHTML() : '') + (state.confirm ? confirmHTML() : '')
    + (state.payOpen ? payModalHTML() : '') + (state.syncOpen ? syncModalHTML() : '');
}

/* ---------------- boot + auth ---------------- */
async function enterApp(session){
  document.getElementById('login').style.display = 'none';
  document.getElementById('shell').style.display = '';
  const email = session.user?.email || '';
  userEmail = email;
  document.getElementById('avatar').textContent = email.slice(0,2).toUpperCase();
  document.getElementById('avatar').title = email;
  document.getElementById('main').innerHTML = '<div style="padding:40px;color:#6b7684;font-size:13px">Loading…</div>';
  try {
    DATA = await loadData();
    M = buildModel(DATA, state.affiliateId);
    state.affiliateId = M.aff.id;
    render();
    setHeaderStatus();
  } catch (err){
    document.getElementById('main').innerHTML = `<div style="padding:40px;color:#a13d2d;font-size:13px">Failed to load data: ${esc(err.message)}</div>`;
  }
}

document.getElementById('login-form').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const btn = document.getElementById('login-btn'), errEl = document.getElementById('login-err');
  btn.disabled = true; btn.textContent = 'Signing in…'; errEl.style.display = 'none';
  const { data, error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('login-email').value.trim(),
    password: document.getElementById('login-pass').value
  });
  btn.disabled = false; btn.textContent = 'Sign in';
  if (error){ errEl.textContent = error.message; errEl.style.display = ''; return; }
  enterApp(data.session);
});

const { data: { session } } = await supabase.auth.getSession();
if (session) enterApp(session);
</script>
